      - paragraph [ref=f13e16]: The 25 standards your AI instruction files are graded against — with citations, so you know exactly why each one matters.
      - paragraph [ref=f13e17]: Pro bonus — included with your Prompt Janitor license.
      - generic [ref=f13e18]: v1.0·July 2026·25 standards
