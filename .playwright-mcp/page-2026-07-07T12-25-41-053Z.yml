    - region "Anthropic 7 standards" [ref=f13e34]:
      - heading "Anthropic 7 standards" [level=2] [ref=f13e35]:
        - text: Anthropic
        - generic [ref=f13e36]: 7 standards
      - generic [ref=f13e37]:
        - article [ref=f13e38]:
          - generic [ref=f13e39]:
            - code [ref=f13e40]: anthropic-clarity
            - generic [ref=f13e41]: Medium
          - paragraph [ref=f13e42]: The file VIOLATES if instructions are vague or ambiguous where a concrete directive is needed (e.g. "be helpful", "handle errors well" with no specifics).
          - paragraph [ref=f13e43]:
            - strong [ref=f13e44]: Why it matters —
            - text: Vague asks produce vague behavior; models follow specifics.
        - article [ref=f13e45]:
          - generic [ref=f13e46]:
            - code [ref=f13e47]: anthropic-examples
            - generic [ref=f13e48]: Medium
          - paragraph [ref=f13e49]: VIOLATES if non-obvious conventions, formats, or behaviors are described without at least one concrete example.
          - paragraph [ref=f13e50]:
            - strong [ref=f13e51]: Why it matters —
            - text: One example beats three sentences of description.
        - article [ref=f13e52]:
          - generic [ref=f13e53]:
            - code [ref=f13e54]: anthropic-delimit-sections
            - generic [ref=f13e55]: Low
          - paragraph [ref=f13e56]: VIOLATES if the file mixes unrelated concerns in one undifferentiated block with no headings, tags, or delimiters separating sections.
          - paragraph [ref=f13e57]:
            - strong [ref=f13e58]: Why it matters —
            - text: Structure tells the model what belongs together.
        - article [ref=f13e59]:
          - generic [ref=f13e60]:
            - code [ref=f13e61]: anthropic-data-vs-instructions
            - generic [ref=f13e62]: Medium
          - paragraph [ref=f13e63]: VIOLATES if variable or contextual data is tangled directly into directives instead of being clearly marked as data.
          - paragraph [ref=f13e64]:
            - strong [ref=f13e65]: Why it matters —
            - text: Unmarked data gets treated as instruction, and vice versa.
        - article [ref=f13e66]:
          - generic [ref=f13e67]:
            - code [ref=f13e68]: anthropic-allow-idk
            - generic [ref=f13e69]: High
          - paragraph [ref=f13e70]: VIOLATES if the file asks the agent to produce facts, APIs, file paths, or commands but never tells it to admit uncertainty or avoid inventing details.
          - paragraph [ref=f13e71]:
            - strong [ref=f13e72]: Why it matters —
            - text: "The #1 defense against hallucinated paths and APIs."
        - article [ref=f13e73]:
          - generic [ref=f13e74]:
            - code [ref=f13e75]: anthropic-positive-framing
            - generic [ref=f13e76]: Low
          - paragraph [ref=f13e77]: VIOLATES if guidance is expressed almost entirely as prohibitions ("don't…") without stating the desired behavior to do instead.
          - paragraph [ref=f13e78]:
            - strong [ref=f13e79]: Why it matters —
            - text: Models steer better toward stated targets than away from bans.
        - article [ref=f13e80]:
          - generic [ref=f13e81]:
            - code [ref=f13e82]: anthropic-context-placement
            - generic [ref=f13e83]: Low
          - paragraph [ref=f13e84]: VIOLATES if long reference material or background is placed in the middle of actionable instructions rather than grouped at the end or in its own section.
          - paragraph [ref=f13e85]:
            - strong [ref=f13e86]: Why it matters —
            - text: Mid-stream reference dilutes the directives around it.
    - region "OpenAI 8 standards" [ref=f13e87]:
      - heading "OpenAI 8 standards" [level=2] [ref=f13e88]:
        - text: OpenAI
        - generic [ref=f13e89]: 8 standards
      - generic [ref=f13e90]:
        - article [ref=f13e91]:
          - generic [ref=f13e92]:
            - code [ref=f13e93]: openai-identity
            - generic [ref=f13e94]: Medium
          - paragraph [ref=f13e95]: VIOLATES if the file never states the agent's purpose, role, or the project it serves.
          - paragraph [ref=f13e96]:
            - strong [ref=f13e97]: Why it matters —
            - text: Identity anchors every downstream decision.
        - article [ref=f13e98]:
          - generic [ref=f13e99]:
            - code [ref=f13e100]: openai-dos-and-donts
            - generic [ref=f13e101]: Medium
          - paragraph [ref=f13e102]: VIOLATES if behavioral rules are stated only abstractly without explicit dos and don'ts the agent can follow.
          - paragraph [ref=f13e103]:
            - strong [ref=f13e104]: Why it matters —
            - text: Abstract values don't constrain concrete actions.
        - article [ref=f13e105]:
          - generic [ref=f13e106]:
            - code [ref=f13e107]: openai-example-consistency
            - generic [ref=f13e108]: Low
          - paragraph [ref=f13e109]: VIOLATES if examples in the file use inconsistent formatting or contradict each other.
          - paragraph [ref=f13e110]:
            - strong [ref=f13e111]: Why it matters —
            - text: Contradictory examples train contradictory behavior.
        - article [ref=f13e112]:
          - generic [ref=f13e113]:
            - code [ref=f13e114]: openai-structure
            - generic [ref=f13e115]: Low
          - paragraph [ref=f13e116]: VIOLATES if the file lacks any markdown headers or hierarchy and is hard to scan for distinct topics.
          - paragraph [ref=f13e117]:
            - strong [ref=f13e118]: Why it matters —
            - text: Both humans and models navigate by structure.
        - article [ref=f13e119]:
          - generic [ref=f13e120]:
            - code [ref=f13e121]: openai-explicitness
            - generic [ref=f13e122]: High
          - paragraph [ref=f13e123]: VIOLATES if the file relies on the agent inferring critical requirements (stack, commands, constraints) that are never stated outright.
          - paragraph [ref=f13e124]:
            - strong [ref=f13e125]: Why it matters —
            - text: What isn't stated will be guessed — sometimes wrong.
        - article [ref=f13e126]:
          - generic [ref=f13e127]:
            - code [ref=f13e128]: openai-context-early
            - generic [ref=f13e129]: Low
          - paragraph [ref=f13e130]: VIOLATES if static, reusable context (project facts, conventions) is buried at the end after volatile task detail rather than established up front.
          - paragraph [ref=f13e131]:
            - strong [ref=f13e132]: Why it matters —
            - text: Stable facts up front frame everything after them.
        - article [ref=f13e133]:
          - generic [ref=f13e134]:
            - code [ref=f13e135]: openai-agentic-planning
            - generic [ref=f13e136]: Low
          - paragraph [ref=f13e137]: VIOLATES if the file describes multi-step tasks without guiding the agent to plan or decompose before acting.
          - paragraph [ref=f13e138]:
            - strong [ref=f13e139]: Why it matters —
            - text: Unplanned multi-step work drifts and stalls.
        - article [ref=f13e140]:
          - generic [ref=f13e141]:
            - code [ref=f13e142]: openai-persistence
            - generic [ref=f13e143]: Medium
          - paragraph [ref=f13e144]: VIOLATES if the file asks the agent to complete tasks but permits stopping early without finishing or verifying the work.
          - paragraph [ref=f13e145]:
            - strong [ref=f13e146]: Why it matters —
            - text: Agents stop at the first plausible answer unless told not to.
    - region "Cursor 6 standards" [ref=f13e147]:
      - heading "Cursor 6 standards" [level=2] [ref=f13e148]:
        - text: Cursor
        - generic [ref=f13e149]: 6 standards
      - generic [ref=f13e150]:
        - article [ref=f13e151]:
          - generic [ref=f13e152]:
            - code [ref=f13e153]: cursor-scoped
            - generic [ref=f13e154]: Medium
          - paragraph [ref=f13e155]: VIOLATES if the file is bloated with rambling or tangential content rather than concise, scoped instructions.
          - paragraph [ref=f13e156]:
            - strong [ref=f13e157]: Why it matters —
            - text: Every wasted token crowds out code context.
        - article [ref=f13e158]:
          - generic [ref=f13e159]:
            - code [ref=f13e160]: cursor-specific-refs
            - generic [ref=f13e161]: Low
          - paragraph [ref=f13e162]: VIOLATES if it points to "the relevant files" or "the config" vaguely instead of naming specific files or paths.
          - paragraph [ref=f13e163]:
            - strong [ref=f13e164]: Why it matters —
            - text: Named paths are actionable; "the config" is a guess.
        - article [ref=f13e165]:
          - generic [ref=f13e166]:
            - code [ref=f13e167]: cursor-declare-conventions
            - generic [ref=f13e168]: Medium
          - paragraph [ref=f13e169]: VIOLATES if the project's stack, build/test commands, or core conventions are never declared.
          - paragraph [ref=f13e170]:
            - strong [ref=f13e171]: Why it matters —
            - text: The first thing an agent needs is how to build and test.
        - article [ref=f13e172]:
          - generic [ref=f13e173]:
            - code [ref=f13e174]: cursor-one-concern
            - generic [ref=f13e175]: Low
          - paragraph [ref=f13e176]: VIOLATES if a single section tries to govern many unrelated concerns that should be split.
          - paragraph [ref=f13e177]:
            - strong [ref=f13e178]: Why it matters —
            - text: Mixed sections are half-read and half-applied.
        - article [ref=f13e179]:
          - generic [ref=f13e180]:
            - code [ref=f13e181]: cursor-no-stale-blanket
            - generic [ref=f13e182]: Low
          - paragraph [ref=f13e183]: VIOLATES if it contains always-apply guidance that is over-broad, outdated, or no longer matches the described project.
          - paragraph [ref=f13e184]:
            - strong [ref=f13e185]: Why it matters —
            - text: Stale blanket rules teach the agent to distrust the file.
        - article [ref=f13e186]:
          - generic [ref=f13e187]:
            - code [ref=f13e188]: cursor-code-style-examples
            - generic [ref=f13e189]: Low
          - paragraph [ref=f13e190]: VIOLATES if it mandates a code style without showing a concrete example of compliant code.
          - paragraph [ref=f13e191]:
            - strong [ref=f13e192]: Why it matters —
            - text: Style is imitated from examples, not adjectives.
    - region "Karpathy / community 4 standards" [ref=f13e193]:
      - heading "Karpathy / community 4 standards" [level=2] [ref=f13e194]:
        - text: Karpathy / community
        - generic [ref=f13e195]: 4 standards
      - generic [ref=f13e196]:
        - article [ref=f13e197]:
          - generic [ref=f13e198]:
            - code [ref=f13e199]: community-success-criteria
            - generic [ref=f13e200]: Medium
          - paragraph [ref=f13e201]: VIOLATES if tasks are described without any definition of done or success criteria.
          - paragraph [ref=f13e202]:
            - strong [ref=f13e203]: Why it matters —
            - text: Without "done", agents under- or over-shoot.
        - article [ref=f13e204]:
          - generic [ref=f13e205]:
            - code [ref=f13e206]: community-no-dead-context
            - generic [ref=f13e207]: Low
          - paragraph [ref=f13e208]: VIOLATES if it includes reference content that is never connected to any instruction or used by any task.
          - paragraph [ref=f13e209]:
            - strong [ref=f13e210]: Why it matters —
            - text: Dead context costs tokens and buys nothing.
        - article [ref=f13e211]:
          - generic [ref=f13e212]:
            - code [ref=f13e213]: community-single-source
            - generic [ref=f13e214]: Medium
          - paragraph [ref=f13e215]: VIOLATES if the same topic is governed by guidance scattered across multiple places that could drift out of sync.
          - paragraph [ref=f13e216]:
            - strong [ref=f13e217]: Why it matters —
            - text: Duplicated guidance always eventually contradicts itself.
        - article [ref=f13e218]:
          - generic [ref=f13e219]:
            - code [ref=f13e220]: community-concrete-over-abstract
            - generic [ref=f13e221]: Low
          - paragraph [ref=f13e222]: VIOLATES if key guidance stays abstract where a concrete rule, value, or example is clearly needed.
          - paragraph [ref=f13e223]:
            - strong [ref=f13e224]: Why it matters —
            - text: Concrete rules are checkable; abstractions are vibes.
    - paragraph [ref=f13e226]: Prompt Janitor — the visibility layer for every prompt on your Mac.