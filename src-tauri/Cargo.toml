[package]
name = "prompt-janitor"
version = "0.1.0"
description = "Find, grade, and fix the AI prompt files across your projects."
authors = ["Ahmed ABOUELLEIL"]
edition = "2021"

# The library holds the app logic so it can be shared with mobile targets later.
[lib]
name = "prompt_janitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["specta"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
globset = "0.4"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
