[package]
name = "prompt-janitor"
version = "0.1.0"
description = "Find, grade, and fix the AI prompt files across your projects."
authors = ["Ahmed ABOUELLEIL"]
edition = "2021"

# The library holds the app logic so it can be shared with mobile targets later.
[lib]
name = "prompt_janitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
