[package]
name = "prompt-janitor"
version = "0.1.1"
# Two binaries exist (app + license-tool); tell cargo/tauri which one is the app.
default-run = "prompt-janitor"
description = "Find, grade, and fix the AI prompt files across your projects."
authors = ["Ahmed ABOUELLEIL"]
edition = "2021"

# The library holds the app logic so it can be shared with mobile targets later.
[lib]
name = "prompt_janitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Vendor-side tool: mints the license keys the app verifies offline.
[[bin]]
name = "license-tool"
path = "src/bin/license_tool.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `image-png` is what gives `Image::from_bytes` a PNG decoder — the tray needs it
# to turn the committed template art into an icon.
tauri = { version = "2", features = ["macos-private-api", "specta", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
globset = "0.4"
regex = "1"
tauri-plugin-dialog = "2.7.1"
notify = "8.2.0"
tokio = { version = "1.52.3", features = ["time"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
git2 = { version = "0.21.0", default-features = false }
ed25519-dalek = "2"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Uninstall moves the app bundle to the Trash. `trash` wraps NSFileManager's
# `trashItemAtURL:`, which needs no Apple-events permission and cannot be made
# to run a script by a path containing a quote — both of which ruled out the
# `osascript`/Finder route.
[target.'cfg(target_os = "macos")'.dependencies]
trash = "5.2.6"
