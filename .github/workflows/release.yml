name: Release

# Builds the macOS app and attaches it to a draft GitHub release whenever a
# v* tag is pushed. Publish the draft manually after checking the artifacts.
#
# Unsigned builds work out of the box. Code signing + notarization activate
# automatically once these repo secrets exist (Apple Developer Program):
#   APPLE_CERTIFICATE             base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD    password for the .p12
#   APPLE_SIGNING_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID / APPLE_PASSWORD     Apple ID + app-specific password (notarization)
#   APPLE_TEAM_ID                 the 10-character team id
#
# In-app updates are signed with the minisign keypair whose public half is
# inlined in `tauri.conf.json` (plugins.updater.pubkey). The private half lives
# only in these repo secrets — never in the tree:
#   TAURI_SIGNING_PRIVATE_KEY           contents of the .key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its passphrase ("" if none)
# Every action below is pinned to a commit SHA (comment = the tag it was
# resolved from) because this job holds the updater key: a moved tag on any
# of them would run foreign code with signing material in the environment.
# The job also runs in the `release` environment so a required reviewer can
# gate it in repo settings.
#
# `--config src-tauri/tauri.updater.conf.json` is what turns on
# `createUpdaterArtifacts`, so a local `pnpm tauri build` without the key keeps
# working. tauri-action uploads the resulting `latest.json` to the release
# alongside the bundles (its `includeUpdaterJson` input defaults to true).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-macos:
    name: macOS universal
    runs-on: macos-latest
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch tip, resolved 2026-09-02
        with:
          toolchain: stable
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      # The bundler treats a *present* APPLE_CERTIFICATE as "signing requested",
      # so an empty secret must not become an empty env var — export each one
      # only when it has a value. Signing + notarization therefore activate the
      # moment the secrets exist, and are cleanly skipped until then.
      - name: Export Apple signing env when configured
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name<<PJ_EOF" >> "$GITHUB_ENV"
              echo "$value" >> "$GITHUB_ENV"
              echo "PJ_EOF" >> "$GITHUB_ENV"
            fi
          done

      - name: Build and draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Prompt Janitor ${{ github.ref_name }}"
          releaseBody: "Download the .dmg below. See commit history for changes."
          releaseDraft: true
          args: --target universal-apple-darwin --config src-tauri/tauri.updater.conf.json
